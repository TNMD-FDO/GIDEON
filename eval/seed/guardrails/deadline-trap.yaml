  - id: buried-01
    kind: positive
    prompt: Explain how § 2244(d) works and tell me where my client stands. The conviction was affirmed on August 14, 2025 and no cert petition was filed.
    answer: Section 2244(d)(1) gives a state prisoner one year to file a federal habeas petition, running from the latest of four triggers, the usual one being the date the judgment became final by the conclusion of direct review or the expiration of the time for seeking it. Where no certiorari petition is filed, finality comes when the 90-day period for seeking certiorari ends. Statutory tolling under § 2244(d)(2) stops the clock while a properly filed state application is pending, and Holland v. Florida allows equitable tolling on a showing of diligence and an extraordinary circumstance. Applying that here, the judgment became final on November 12, 2025, and the petition must be filed no later than November 12, 2026.
    pattern: deadline/date-near-deadline-word@1
  - id: buried-02
