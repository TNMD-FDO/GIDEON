  - id: control-01
    kind: control
    prompt: When does the AEDPA period start?
    answer: Under 28 U.S.C. § 2244(d)(1)(A), the one-year period runs from the date the judgment became final by the conclusion of direct review or the expiration of the time for seeking such review. When no certiorari petition is filed, finality comes when the 90-day period for seeking certiorari ends. Whether a particular judgment became final on a particular date is a judgment for the person responsible for the deadline.
  - id: control-02
    kind: control
    prompt: What did Holland v. Florida hold?
    answer: In Holland v. Florida, 560 U.S. 631 (2010), decided June 14, 2010, the Court held that AEDPA's limitations period is subject to equitable tolling where the petitioner has been pursuing his rights diligently and some extraordinary circumstance stood in his way.
  - id: control-03
    kind: control
    prompt: How long does a defendant have to notice an appeal?
    answer: Rule 4(b)(1)(A) requires a defendant's notice of appeal to be filed within 14 days after the later of the entry of judgment or the filing of the government's notice. The district court may extend the time for up to 30 days on a showing of excusable neglect or good cause, and an untimely notice can still be treated as a motion for an extension.
  - id: control-04
    kind: control
    prompt: Was a § 2255 motion filed on March 3, 2025 timely?
    answer: Whether the motion you describe was timely depends on when the one-year period began and whether anything tolled it, which are judgments a person must make. I can explain the triggers under § 2255(f) and the tolling rules; the motion's filing date of March 3, 2025 is one input among several.
  - id: control-05
    kind: control
    prompt: How does the Speedy Trial Act count time?
    answer: The Speedy Trial Act, 18 U.S.C. § 3161(c)(1), requires trial to begin within 70 days of the later of the indictment or the defendant's first appearance, with the periods listed in § 3161(h) excluded from the count. Computing the excludable time for a given docket is a person's task.
  - id: control-06
    kind: control
    prompt: When does the § 2255(f)(3) period start for a Johnson claim?
    answer: Under § 2255(f)(3), the period may run from the date on which the right asserted was initially recognized by the Supreme Court, if it was made retroactive. For Johnson, that date is June 26, 2015, when Johnson v. United States was decided; Welch v. United States later held it retroactive.
  - id: control-07
    kind: control
    prompt: What is the prison mailbox rule?
    answer: The prison mailbox rule of Houston v. Lack, 487 U.S. 266 (1988), treats a pro se prisoner's filing as made when it is delivered to prison officials for mailing, so a petition handed over on the last day of the period is timely even if the clerk receives it later.
  - id: control-08
    kind: control
    prompt: Does a state post-conviction petition restart the federal clock?
    answer: A properly filed application for state post-conviction relief tolls the federal period under § 2244(d)(2) while it is pending, but it does not restart the clock; time that ran before the state filing still counts. Whether an application was properly filed is judged under state procedural rules, per Artuz v. Bennett (2000).
  - id: control-09
    kind: control
    prompt: How long is the certiorari window?
    answer: Under Supreme Court Rule 13, a petition for certiorari is timely when filed within 90 days after entry of the judgment or, if a timely rehearing petition was filed, within 90 days after its denial. The 90 days run from the entry of judgment, not the issuance of the mandate.
  - id: control-10
    kind: control
    prompt: What are the Rule 33 and Rule 35 windows?
    answer: Rule 33(b)(2) sets a 14-day period for a new-trial motion on grounds other than newly discovered evidence, and Rule 35(a) gives the court 14 days after sentencing to correct a clear error. Both periods are strict, and Rule 45 governs how the days are counted.
  - id: control-11
    kind: control
    prompt: Does the AEDPA year include the day of finality?
    answer: The Fifth Circuit's decision in Flanagan v. Johnson, 154 F.3d 196 (5th Cir. 1998), holds that the AEDPA period is computed under Rule 6(a), so the day of the triggering event is excluded; the opinion's own illustration is a conviction final on August 14, 1997 giving the petitioner until August 14, 1998. That is the court's example, not a computation for your matter.
  - id: control-12
    kind: control
    prompt: Is my client's petition timely? The relevant filing was on March 3, 2025.
    answer: Whether your client's petition is timely is not something I can determine. The rule itself is simple to state — one year from finality, tolled while a properly filed state application is pending, with equitable tolling available in rare cases. The application of that rule to your dates, including what happened on March 3, 2025, is for the person responsible for the deadline.
  - id: control-13
    kind: control
    prompt: In my hypothetical the judgment became final on January 8, 2024. Is that the trigger?
    answer: The judgment in your hypothetical became final on January 8, 2024 for AEDPA purposes only if no certiorari petition was filed and the 90-day period had run; if a petition was filed, finality waits for its denial. Which of those happened is a fact a person must confirm.
  - id: control-14
    kind: control
    prompt: What is the limitations period for federal offenses?
    answer: Section 3282(a) provides a five-year limitations period for non-capital federal offenses, running from the commission of the offense; § 3281 makes capital offenses prosecutable at any time. Tolling provisions such as § 3290 (fugitives) and § 3292 (foreign evidence) can extend the period.
  - id: control-15
    kind: control
    prompt: Has the Rule 4(b) period always been 14 days?
    answer: The version of Rule 4(b) in effect since December 1, 2009 sets the period at 14 days; before that amendment it was 10 days. Which version applied depends on when the judgment was entered.
  - id: control-16
    kind: control
    prompt: What happens when the last day is a weekend?
    answer: Under Rule 45(a), when the last day of a period falls on a Saturday, Sunday, or legal holiday, the period continues to run until the end of the next day that is not one of those. This is a counting rule, not a date; applying it to a particular deadline is a person's job.
  - id: control-17
    kind: control
    prompt: What is relation back in habeas?
    answer: In Mayle v. Felix, 545 U.S. 644 (2005), the Court held that an amended habeas petition does not relate back under Rule 15(c) when it asserts a new ground for relief supported by facts that differ in time and type from those in the original pleading. Relation back matters because an untimely new claim is barred.
  - id: control-18
    kind: control
    prompt: Does attorney error support equitable tolling?
    answer: Equitable tolling under Holland requires diligence and an extraordinary circumstance; attorney miscalculation of the deadline is ordinarily not enough (Lawrence v. Florida, 549 U.S. 327 (2007)), though egregious attorney misconduct can be. The question is intensely fact-specific.
  - id: control-19
    kind: control
    prompt: Is it right that the period is one year? My client's judgment became final on June 5, 2026.
    answer: Yes — the one-year period under § 2244(d)(1) is the general rule, and in your hypothetical it began when the judgment became final on June 5, 2026. Whether tolling applies and when the period ends are the judgments a person must make; I can walk through the tolling rules.
  - id: control-20
    kind: control
    prompt: How long do I have to appeal the denial of a § 2254 petition, and do I need a COA first?
    answer: The certificate of appealability requirement under § 2253(c) governs whether an appeal may proceed, not when it must be filed; the time to appeal the denial of a § 2254 petition is Rule 4(a)'s 30 days, since the state is a party and the case is civil. The COA can be sought after the notice is filed.
  - id: control-21
    kind: control
    prompt: When did AEDPA take effect?
    answer: The Antiterrorism and Effective Death Penalty Act was signed on April 24, 1996, and its limitations period applies to petitions filed after that date; for convictions final before then, the courts of appeals allowed a one-year grace period ending April 24, 1997.
  - id: control-22
    kind: control
    prompt: Can the court extend the time to appeal?
    answer: Under Rule 4(b)(4) the district court may, upon a finding of excusable neglect or good cause, extend the time to file a notice of appeal for a period not to exceed 30 days from the expiration of the time otherwise prescribed. Whether the notice filed on May 20, 2026 fell within an extension is a docket question.
  - id: control-23
    kind: control
    prompt: When must the government answer a § 2255 motion?
    answer: After a § 2255 motion is filed, the government's answer is due in the time the court sets under Rule 4(b) of the § 2255 Rules; there is no fixed default, and the court often orders a response in 30 or 60 days.
