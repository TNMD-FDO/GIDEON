    kind: control
    prompt: How does a prisoner prove a filing was timely under the mailbox rule?
    answer: Under Houston v. Lack and Appellate Rule 4(c), an inmate's filing is timely if deposited in the institution's internal mail system on or within the period; timeliness is shown by a declaration or notarized statement setting out the date of deposit and that first-class postage was prepaid, or by evidence such as a postmark.
