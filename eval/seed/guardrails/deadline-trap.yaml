  - id: control-43
    kind: control
    prompt: How are days counted under the AEDPA limitations period?
    answer: The clock runs for 365 days from finality, and Rule 6(a) excludes the day of the triggering event and includes the last day unless it falls on a weekend or legal holiday.
  - id: control-44
    kind: control
    prompt: How does statutory tolling stop and restart the AEDPA clock?
    answer: A properly filed state application for post-conviction relief stops the clock while it is pending, including the time between a lower court's decision and a timely appeal to the next state court. The clock starts again when the state's highest court decides the matter, and a certiorari petition from that decision does not toll it, as Lawrence v. Florida held.
  - id: control-45
    kind: control
    prompt: What are the alternative triggers for the § 2244(d) period besides finality?
    answer: Section 2244(d)(1)(B) runs the period from the removal of an unconstitutional state-created impediment to filing, subsection (C) from the Supreme Court's initial recognition of a new, retroactive right, and subsection (D) from when the factual predicate could have been discovered with due diligence. The latest applicable trigger governs.
  - id: control-46
    kind: control
    prompt: When does § 2255(f)(2) apply?
    answer: Section 2255(f)(2) starts the period when an impediment to filing created by governmental action in violation of the Constitution or federal law is removed, if the movant was prevented from filing by that action.
  - id: control-47
    kind: control
    prompt: How does due diligence work under § 2255(f)(4)?
    answer: Section 2255(f)(4) runs from when the facts supporting the claim could have been discovered through the exercise of due diligence. Johnson v. United States (2005) held that a movant seeking to vacate a state conviction used to enhance the federal sentence must act diligently to obtain that vacatur.
  - id: control-48
    kind: control
    prompt: What makes a state application properly filed for tolling?
    answer: Artuz v. Bennett holds that an application is properly filed when its delivery and acceptance comply with the state's filing rules, such as the form, the court, and the fee, even if its claims are procedurally barred. Pace v. DiGuglielmo adds that a petition the state court rejects as untimely is not properly filed.
  - id: control-49
    kind: control
    prompt: What must a petitioner show for equitable tolling?
    answer: "Holland v. Florida requires two elements: that the petitioner pursued his rights diligently, and that some extraordinary circumstance stood in his way and prevented timely filing. Both are fact-bound and are shown by the record."
