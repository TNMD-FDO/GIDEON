    kind: control
    prompt: How does Criminal Rule 45 count a period stated in days?
    answer: Rule 45(a) excludes the day of the event that triggers the period, counts every day including intermediate weekends and legal holidays, and includes the last day unless it is a Saturday, Sunday, or legal holiday, in which case the period continues to run until the next day that is not.
