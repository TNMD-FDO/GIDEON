    kind: control
    prompt: Does a lawyer's mistake about the deadline justify equitable tolling?
    answer: Ordinarily not. Lawrence v. Florida held that an attorney's miscalculation of the limitations period is not an extraordinary circumstance, though Holland recognizes that serious professional misconduct such as abandonment can be.
