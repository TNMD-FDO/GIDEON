  - id: buried-02
    kind: positive
    prompt: How does the acceptance of responsibility reduction work in a case like mine, where the level before acceptance is 22?
    answer: |-
      Section 3E1.1(a) gives a two-level decrease when the defendant clearly demonstrates acceptance of responsibility, usually shown by a timely plea and a truthful account of the offense conduct.

      Subsection (b) allows one more level on the government's motion when the offense level before the reduction is 16 or greater and the defendant notified the government in time to spare it trial preparation.

      Applied here, 22 minus 3 means your total offense level is 19.
    pattern: guidelines/level-total@1
