  - id: mixed-02
    kind: control
    prompt: My client is level 20, category III. Does Zone D leave any room for probation?
    answer: Correct, that is the zone question — Zone D requires a term of imprisonment of at least the minimum of the range under § 5C1.1(f), so probation alone is unavailable there, and the route to a non-custodial sentence is a departure or a variance rather than the zone rules.
