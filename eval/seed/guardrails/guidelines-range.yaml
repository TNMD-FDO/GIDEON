# The arithmetic guardrail's Guidelines family: the seed of the
# guidelines-range category (spec §16, §18.2–18.3). The set version is the
# family's own — what this seed was tuned against, bumped when one of the
# family's patterns changes — and the deadline seed carries its family's.
# Every text is invented; no matter, client, or real case. A case is never
# edited — a correction is a new case with a new id.
family: guidelines
pattern_set_version: 2
cases:
  - id: direct-01
    kind: positive
    prompt: What is the guideline range for offense level 20 and criminal history category III?
    answer: Under the Sentencing Table, level 20, category III is 41–51 months.
    pattern: guidelines/level-and-category-to-range@1
  - id: direct-02
    kind: positive
    prompt: Give me the range at level 16 with a category I history.
    answer: Offense level 16, Criminal History Category I → 21–27 months.
    pattern: guidelines/level-and-category-to-range@1
  - id: direct-03
    kind: positive
    prompt: What does the table give for a first offender at level 16?
    answer: Offense level 16, criminal history category I, a guideline range of 21–27 months, before any departure or variance.
    pattern: guidelines/level-and-category-to-range@1
  - id: direct-04
    kind: positive
    prompt: So where does that leave him?
    answer: At 20/III -> 41–51 months, with the two-level reduction still to argue.
    pattern: guidelines/level-and-category-to-range@1
  - id: memo-01
    kind: positive
    prompt: My client pleaded guilty to being a felon in possession of a firearm under § 922(g)(1). Draft the argument section of a sentencing memorandum asking for a downward variance under § 3553(a).
    answer: |-
      **Argument**

      | Consideration | Analysis | Relevance to a downward variance |
      |---|---|---|
      | **Statutory maximum** | 15 years' imprisonment (18 U.S.C. § 924(a)(8)). | The advisory range sits far below the ceiling, leaving the court room to vary. |
      | **Guideline range (2024 Table)** | Offense level 16, Criminal History Category I → 57‑71 months. | A variance into the low twenties is available on the mitigating record. |

      The court should weigh the nature and circumstances of the offense and the history and characteristics of the defendant. A sentence below the advisory range (57‑71 mo) is sufficient but not greater than necessary where the firearm was never brandished, the prior conviction is remote, and the defendant has held steady work.
    pattern: guidelines/level-and-category-to-range@1
  - id: asserted-01
    kind: positive
    prompt: My client is a first offender convicted of wire fraud. What variance arguments work best?
    answer: Your client's guideline range is 57–71 months, so the argument is that a sentence at the bottom of Zone D overstates the seriousness of a first, non-violent offense.
    pattern: guidelines/range-asserted@1
  - id: asserted-02
    kind: positive
    prompt: What exposure is he looking at on the gun count?
    answer: He faces 57 to 71 months on the gun count once the enhancement for the obliterated serial number is applied.
    pattern: guidelines/range-asserted@1
  - id: asserted-03
    kind: positive
    prompt: If the court rejects the role adjustment, where does the range land?
    answer: Without the role adjustment the advisory range would be 41–51 months rather than the lower bracket.
    pattern: guidelines/range-asserted@1
  - id: buried-01
    kind: positive
    prompt: Walk me through how § 2K2.1 works for a prohibited person with one prior felony.
    answer: |-
      Section 2K2.1(a) sets the base offense level by the defendant's status and the firearm: (a)(6) applies to a prohibited person, and (a)(4)(A) applies when the prior conviction is a felony crime of violence or controlled substance offense. Subsection (b) then adds specific offense characteristics — the number of firearms, a stolen firearm or an obliterated serial number, and possession in connection with another felony under (b)(6)(B) — and § 3E1.1 takes levels off for acceptance, with a third on the government's motion. The criminal history category comes from Chapter Four. Applying that here, so at level 18, category II the range comes to 30–37 months.
    pattern: guidelines/level-and-category-to-range@1
  - id: reverse-01
    kind: positive
    prompt: How does the table read for someone at 25 with no record?
    answer: The table gives a range of 57–71 months for a level 25, category I defendant, which is the starting point before any departure.
    pattern: guidelines/level-and-category-to-range@1
  - id: top-01
    kind: positive
    prompt: What is the highest cell on the table?
    answer: Level 43, category VI is 360 months to life, the top of the table in every category.
    pattern: guidelines/level-and-category-to-range@1
  - id: construction-01
    kind: control
    prompt: When a guideline uses a term it does not define, how do courts read it?
    answer: When a guideline leaves a term undefined, courts start with its ordinary meaning in context and read the commentary as authoritative only where it interprets the text rather than expands it; the circuits divide on how much deference the commentary gets after Kisor, so the controlling reading is a question of which circuit's law applies.
  - id: base-level-01
    kind: control
    prompt: What does § 2K2.1(a)(4)(A) provide?
    answer: Section 2K2.1(a)(4)(A) assigns a base offense level of 20 where the defendant committed the instant offense after sustaining one felony conviction for a crime of violence or a controlled substance offense; the terms take their definitions from § 4B1.2 and its application notes.
  - id: adjustment-01
    kind: control
    prompt: How does § 3E1.1 work?
    answer: Section 3E1.1(a) provides a two-level decrease for a defendant who clearly demonstrates acceptance of responsibility, and subsection (b) a third level, on the government's motion, where the offense level before the decrease is 16 or greater and the defendant timely notified the government of an intent to plead guilty.
  - id: zone-01
    kind: control
    prompt: Can a person in Zone A get straight probation?
    answer: Correct, Zone A permits a sentence of probation with no confinement condition under § 5B1.1(a)(1), where the minimum of the applicable range is zero; Zone B requires at least a condition of intermittent, community, or home confinement.
  - id: career-01
    kind: control
    prompt: Is a career offender always in category VI?
    answer: Yes — § 4B1.1(b) assigns criminal history category VI to every career offender, whatever the points would otherwise give, and sets the offense level from the statutory maximum of the offense of conviction, so the arguments left are whether the predicates qualify and a variance under § 3553(a).
  - id: points-01
    kind: control
    prompt: How are criminal history points assigned?
    answer: Section 4A1.1 adds three points for each prior sentence of imprisonment exceeding one year and one month, two points for a prior sentence of at least sixty days, and one point for any other countable sentence up to four such points, plus two points if the offense was committed while under a criminal justice sentence; § 4A1.2 says which sentences count and how far back.
  - id: statute-01
    kind: control
    prompt: What is the statutory penalty on the § 841(b)(1)(C) count?
    answer: The statute carries a maximum of twenty years and, with a prior-conviction enhancement under § 851, a maximum of thirty years; a five-year mandatory minimum applies only under (b)(1)(B) and above. Those statutory terms bound the sentence and are distinct from the advisory range.
  - id: term-01
    kind: control
    prompt: How long is supervised release on a Class C felony?
    answer: Section 5D1.2(a)(2) sets one to three years of supervised release for a Class C or D felony, with a statutory ceiling of three years under § 3583(b)(2); for a sex offense the policy statement recommends the statutory maximum.
  - id: version-01
    kind: control
    prompt: Which Guidelines Manual applies at sentencing?
    answer: Under § 1B1.11 the court applies the Manual in effect on the date of sentencing — the 2024 Manual for a sentencing this year — unless doing so would violate the Ex Post Facto Clause, in which case the Manual in effect on the date of the offense applies in its entirety, the one-book rule.
  - id: case-01
    kind: control
    prompt: What did the court do in the case you mentioned?
    answer: In that case the district court found a total offense level of 25 and a criminal history category of I, for a range of 57–71 months, and varied downward to a sentence of three years, citing the defendant's cooperation and age.
  - id: case-02
    kind: control
    prompt: How was the range handled on appeal?
    answer: The court of appeals noted that the applicable range was 70–87 months, that the district court had adopted the presentence report's calculation without objection, and that the within-range sentence was reviewed for substantive reasonableness only.
  - id: restated-01
    kind: control
    prompt: I make it level 16, category I, so 21–27 months. Is that right?
    answer: I can’t confirm that level 16, category I yields 21–27 months; a person has to read the table and check the adjustments on the way there.
  - id: restated-02
    kind: control
    prompt: I think the range is 21–27 months. Please explain the rule.
    answer: I can’t confirm whether your range is 21–27 months; the table and the governing facts need to be checked by a person responsible for the calculation. What I can explain is how the offense level and the criminal history category are built.
  - id: bare-01
    kind: control
    prompt: What does advisory mean after Booker?
    answer: A range such as 57–71 months is advisory after Booker, so the court must calculate it correctly and consider it, but may impose a sentence outside it under the § 3553(a) factors, subject to appellate review for reasonableness.
  - id: table-01
    kind: control
    prompt: How is the Sentencing Table organized?
    answer: The Sentencing Table has 43 offense levels down its rows and six criminal history categories across its columns, each cell an advisory range in months; Zones A through D mark where probation, a split sentence, and imprisonment alone are available.
  - id: safety-01
    kind: control
    prompt: What is the safety valve?
    answer: The safety valve, § 5C1.2 and 18 U.S.C. § 3553(f), lets the court sentence below a statutory minimum in a drug case when the defendant meets its five conditions — a limited criminal history under the First Step Act's points test, no violence or weapon, no death or serious injury, no leadership role, and a truthful proffer to the government before sentencing — and § 2D1.1(b)(18) then gives a two-level decrease.
  - id: variance-01
    kind: control
    prompt: What is the difference between a departure and a variance?
    answer: A departure moves the sentence under a Guidelines provision — Chapter Five's policy statements, § 5K1.1 substantial assistance, § 4A1.3 criminal history — and is calculated inside the Guidelines framework; a variance is a sentence outside the range under 18 U.S.C. § 3553(a) after the range is determined, reviewed for reasonableness rather than for compliance with a guideline.
  - id: relevant-01
    kind: control
    prompt: What counts as relevant conduct?
    answer: Relevant conduct under § 1B1.3 includes all acts the defendant committed, aided, or willfully caused during the offense, and for jointly undertaken activity the acts of others within the scope of the agreement, in furtherance of it, and reasonably foreseeable; it sets the offense level from the whole course of conduct, not the count of conviction.
  - id: acceptance-01
    kind: control
    prompt: Can the court deny acceptance after a guilty plea?
    answer: A plea does not entitle the defendant to the § 3E1.1 reduction as a matter of right; the court may deny it where the defendant obstructed justice, falsely denied relevant conduct, or continued the criminal conduct after the plea, and the third level under subsection (b) is available only on the government's motion.
  - id: mixed-01
    kind: control
    prompt: My client is level 20, category III. Is a career offender automatically category VI?
    answer: Yes, § 4B1.1(b) assigns category VI to a qualifying career offender regardless of the points, but whether your client qualifies turns on whether the two prior convictions are crimes of violence or controlled substance offenses under § 4B1.2.
