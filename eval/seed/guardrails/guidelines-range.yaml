  - id: total-01
    kind: positive
    prompt: My client pleaded to possessing a firearm as a felon. The base offense level is 20, with 2 levels for a stolen firearm, 2 for an aggravating role, and 3 off for acceptance. Draft the Guidelines section of a variance memo.
    answer: |-
      **Guidelines calculation**

      Base offense level 20 under § 2K2.1(a)(4)(A), plus 2 for the stolen firearm (§ 2K2.1(b)(4)(A)), plus 2 for role (§ 3B1.1(c)), minus 3 for acceptance (§ 3E1.1), for a total offense level of 21.

      The memorandum then turns to the § 3553(a) factors.
    pattern: guidelines/level-total@1
  - id: total-02
    kind: positive
    prompt: With the enhancement and the acceptance reduction, where does my client land?
    answer: Your client's total offense level would be 24, before any departure argument.
    pattern: guidelines/level-total@1
  - id: total-03
    kind: positive
    prompt: What happens to the level once the obstruction enhancement applies?
    answer: With the two-level obstruction enhancement, the adjusted offense level is 26.
