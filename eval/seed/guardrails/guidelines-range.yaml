    answer: After the multiple-count adjustment under § 3D1.4, the final offense level comes to 23.
    pattern: guidelines/level-total@1
  - id: total-05
    kind: positive
    prompt: How do the two groups combine?
    answer: Adding one unit for the second group, the combined offense level is 27.
    pattern: guidelines/level-total@1
  - id: total-06
