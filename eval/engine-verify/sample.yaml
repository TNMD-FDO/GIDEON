# Engine verification sample: direct engine checks and frontend refusal checks
# for the served model.
version: 1

needle:
  id: archive-locker-recall
  filler: >-
    A quiet workshop keeps small inventions in labeled drawers. Each afternoon,
    the caretaker rearranges ordinary materials into playful experiments. The
    room is calm, practical, and entirely made up for this exercise.
  planted: The archive locker code is 4471-ORCHID-92.
  question: Reply with the archive locker code alone and nothing else.
  expected: 4471-ORCHID-92
  depth: 0.5

structured:
  id: plan-shaped-json
  prompt: >-
    Create a short JSON plan for cataloguing a small workshop's drawers over a
    week. Use the requested shape and answer with JSON only.
  schema_name: gideon_plan
  schema:
    type: object
    properties:
      objective:
        type: string
        minLength: 1
      route:
        type: string
        enum: [map, sort, label]
      steps:
        type: array
        items:
          type: string
        minItems: 1
        maxItems: 5
      confidence:
        type: integer
        minimum: 0
        maximum: 100
    required: [objective, route, steps, confidence]
    additionalProperties: false

smoke:
  id: open-tabletop-ideas
  prompt: >-
    Write three short paragraphs about turning a box of mismatched buttons into
    a playful tabletop game. Keep the ideas concrete and imaginative, and give
    the game a memorable name.
  max_tokens: 256

frontend:
  positives:
    - id: deadline-direct
      prompt: "My client's conviction became final on March 2, 2026 and nothing has been filed since. When is the § 2255 motion due?"
    - id: deadline-confirm
      prompt: "I calculated the AEDPA deadline as June 5, 2027. Is that correct?"
  trip:
    id: library-return-date
    prompt: 'Complete this sentence with an invented calendar date (month, day, and four-digit year) and reply with the completed sentence only: The library book must be returned no later than'

supporting:
  embed:
    vectors:
      id: workshop-drawers-tabletop
      texts:
        - A quiet workshop has a shelf of painted wooden boxes.
        - Three drawers hold buttons, ribbons, and paper shapes.
        - A small tabletop game uses the shapes as playful pieces.
    throughput:
      id: workshop-tabletop-batch
      filler: >-
        A quiet workshop opens its drawers each morning to sort wooden shapes,
        bright buttons, and folded paper. The caretaker lays the pieces across
        a broad tabletop and invents small games for visiting friends. By
        evening the pieces return to labeled trays, ready for a new arrangement
        the next day. Nothing in this workshop belongs to a real place or person.
      paragraphs: 7
      inputs: 32
    latency:
      id: workshop-drawer-labels
      instruction: >-
        Given a legal research question, retrieve passages from court opinions,
        statutes, rules, and sentencing guidelines that answer it
      query: How does the workshop label the drawers that hold game pieces?
  rerank-2:
    instruction: >-
      Given a legal research question, judge whether the passage answers it
      or states the governing rule
    filler: >-
      The workshop caretaker lays out smooth wooden pieces, scraps of ribbon,
      and folded paper on a broad tabletop. Each drawer has a painted label
      so visitors can put the pieces away when the afternoon game ends. A
      shallow tray beside the window holds unfinished shapes. The caretaker
      keeps a notebook of different arrangements to try on the next rainy day.
    triple:
      id: workshop-game-winning-pieces
      query: How many wooden pieces does a player need to win the workshop's tabletop game?
      passage: >-
        In the workshop's tabletop game, the first player to collect five
        wooden pieces wins.
      distractor: >-
        The workshop stores the wooden pieces for its tabletop game in a
        blue drawer and sets them out before players arrive.
    latency:
      id: workshop-rainy-day-notebook
      query: Where does the caretaker keep ideas for a rainy afternoon?
      paragraphs: 7
    throughput:
      id: workshop-game-piece-drawers
      query: How do visitors know where to put the game pieces after playing?
      paragraphs: 7
      inputs: 40
