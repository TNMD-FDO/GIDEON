name: Enhancement request
description: Suggest an improvement to GIDEON.
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not report a vulnerability here. Report it privately as
        [SECURITY.md](https://github.com/TNMD-FDO/GIDEON/security/policy)
        says. Enhancements are triaged by the CSAs into the development
        repository's private tracker.

        Do not paste any site-file value, secret, chat, matter, or client text.
        Use placeholders and synthetic text throughout this request.
  - type: textarea
    id: request
    attributes:
      label: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this useful?
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: What would you accept instead?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        An enhancement is judged against the build spec and may be recorded as
        out of scope; the outcome is reported on the issue.
  - type: checkboxes
    id: request-requirements
    attributes:
      label: Request requirements
      options:
        - label: I replaced every hostname, address, directory name, and mailbox with a placeholder.
          required: true
        - label: This is not a vulnerability report; a vulnerability goes through SECURITY.md, never an issue.
          required: true
        - label: I dedicate this request and any patch in it to the public domain under the CC0 1.0 Universal dedication, waiving all copyright and related rights I hold in it, worldwide (CONTRIBUTING.md).
          required: true
