name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # A push to main in the private repository runs on the box's runner, so the
    # hosted minutes go to pull requests. A pull request stays hosted, since its
    # code never runs on the persistent runner, and the public export stays
    # hosted because its repository is not private. Each step carries an if on
    # the runner's kind, so no step can run on the wrong one.
    # The gate uses the box's second runner instance, leaving the previous run's box jobs free.
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "checks"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.14" # the box's Ubuntu 26.04 system Python
      - name: Install dev tools
        if: runner.environment == 'github-hosted'
        # The development and CI toolchain is pinned in requirements-dev.txt.
        run: python -m pip install -r requirements-dev.txt
      - name: Host import boundary (stdlib + yaml only)
        if: runner.environment == 'github-hosted'
        run: pytest tests/test_host_import_boundary.py
      - name: Gate
        if: runner.environment == 'github-hosted'
        # Environment comparison, then ruff, mypy, and pytest, stopping at the first failure (tools/gate.py);
        # --all runs the cases marked slow that the local default skips.
        run: python -m tools.gate --all
      - name: Build dev environment on the box
        if: runner.environment == 'self-hosted'
        # A fresh venv in the clean checkout from the pushed pin file, with no
        # pip cache left in the runner's home; the gate's first child compares it.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r requirements-dev.txt
      - name: Host import boundary on the box
        if: runner.environment == 'self-hosted'
        run: .venv/bin/python -m tools.mask -- .venv/bin/pytest tests/test_host_import_boundary.py
      - name: Gate on the box
        if: runner.environment == 'self-hosted'
        # --masked runs pytest where the box's own paths read as empty and only
        # loopback is reachable, so the run sees what a hosted runner sees.
        run: .venv/bin/python -m tools.gate --all --masked

  mirror-images:
    # The one CI step only the box can perform: copy every images.lock pin into
    # the loopback release registry by digest. Runs only for code already on
    # main, after checks — never pull-request code:
    # the runner is persistent and holds Docker access, and untrusted PR code
    # could compromise it (runner hardening is deferred to the public flip; the
    # private flag keeps the box jobs off the public export).
    if: github.event_name == 'push' && github.event.repository.private
    needs: checks
    runs-on: [self-hosted, linux, x64, gpu, dl385-gen11]
    concurrency: mirror-images
    steps:
      - uses: actions/checkout@v7
      - name: Mirror images.lock into the release registry
        # The box's system Python and python3-yaml: the product's own import set, no pip.
        run: python3 -m gideon registry mirror --to 127.0.0.1:5000
      - name: Built-image contract (stdlib unittest, no pip)
        # Every built pin's digest is in the registry, its labels equal the
        # lock's inputs, and its smoke command passes — a merge whose lock
        # names an unbuilt digest is red here, the same day.
        run: python3 -m unittest tests/contract/built_images.py
      - name: Sanity
        run: python3 -m gideon --version

  frontend-contract:
    # The Open WebUI contract: a throwaway Postgres + frontend pair on loopback
    # from the mirrored digests proves a hand-added Function is removed by the apply manifest and that a second
    # push changes nothing. Same trust posture as mirror-images: pushes to
    # main only, after the mirror, on the box's runner with Docker access.
    if: github.event_name == 'push' && github.event.repository.private
    needs: mirror-images
    runs-on: [self-hosted, linux, x64, gpu, dl385-gen11]
    concurrency: frontend-contract
    steps:
      - uses: actions/checkout@v7
      - name: Frontend contract (stdlib unittest, no pip)
        run: python3 -m unittest tests/contract/owui_apply_manifest.py

  search-sentinel:
    # The search sentinel proves the query marker is absent from every log the
    # throwaway stack writes. It shares the frontend contract's loopback port
    # and concurrency group; pytest never collects this module on either runner.
    if: github.event_name == 'push' && github.event.repository.private
    needs: frontend-contract
    runs-on: [self-hosted, linux, x64, gpu, dl385-gen11]
    concurrency: frontend-contract
    steps:
      - uses: actions/checkout@v7
      - name: Search sentinel contract (stdlib unittest, no pip)
        run: python3 -m unittest tests/contract/search_sentinel.py

  smoke:
    # The push smoke: the frozen smoke slice run against the served engine on
    # the standing gideon-ci sibling, which the tool first converges from this
    # pushed tree, gating on a guardrail positive unblocked, a leak, an error,
    # a frontend sample disagreeing, or a case regressed against its committed
    # reference. It takes the engine lock first, so a busy engine is a skip
    # (exit 0, the sibling untouched), never a red push or a disrupted run.
    # -B keeps root's bytecode out of the runner's checkout, which its next
    # clean could not remove; the transcript sits in the runner's temporary
    # directory, so the checkout reads clean, and it holds ids, classes, and
    # verdicts alone.
    if: github.event_name == 'push' && github.event.repository.private
    needs: search-sentinel
    runs-on: [self-hosted, linux, x64, gpu, dl385-gen11]
    concurrency: frontend-contract
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Smoke on the sibling
        shell: bash
        run: sudo python3 -B -m tools.cistack smoke 2>&1 | tee "$RUNNER_TEMP/smoke.txt"
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo '```text'
            if [ -f "$RUNNER_TEMP/smoke.txt" ]; then cat "$RUNNER_TEMP/smoke.txt"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
