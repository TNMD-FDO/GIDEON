  # box with `skopeo inspect` on 2026-09-19. A dependency or base bump is
  # completed by the box build, then the requirements-dev.txt copy moves in the
  # same commit. One argument feeds the driver's two wheels because the two
  # projects release in lockstep and a half-bump would be silent under this
  # writer.
  gideon:
