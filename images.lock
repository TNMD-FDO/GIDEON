# Image pins: registry-agnostic name + digest —
# what `registry mirror` puts in the release registry and `apply` pulls by
# digest. Two kinds. A mirrored pin records the upstream tracking tag
# (`source`) and the multi-platform index digest it resolved to when pinned,
# copied byte-for-byte with `skopeo copy --all --preserve-digests`. A built
# pin records the Dockerfile directory (`build`), the mirrored base it starts
# FROM (`base` + `base_digest`, kept in the same repository under its tag),
# its build inputs (`build_args`, each watched upstream per `watch`), a digest
# over those inputs (`inputs_digest`), and the digest of the image
# `python3 -m tools.imagebuild <name>` pushed (`digest`) — both `unbuilt`
# until the first build. The pin watch proposes the next value as
# a pull request; the resolution record lives in git history and in each bump
# pull request. The release registry's own image is `host.lock`'s, never
# listed here.
version: 1
images:
  caddy:
    source: docker.io/library/caddy:2.11
    digest: sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
  open-webui:
    source: ghcr.io/open-webui/open-webui:v0.11.3
    digest: sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
  # The generator's engine: vLLM's published image,
  # resolved on the box with `skopeo inspect` on 2026-09-04 — a multi-platform
  # index (amd64 and arm64) the mirror copies whole. The pin watch proposes
  # the newest same-shape tag; a person completes the bump only after the
  # engine has come up healthy on the box under the new image and after
  # `engine verify` passes; an engine-image change requires that check.
  vllm-openai:
    source: docker.io/vllm/vllm-openai:v0.27.1
    digest: sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
  # General's metasearch:
  # SearXNG's published image, run as shipped, resolved on the box with
  # `skopeo inspect` on 2026-09-08 — a three-platform index (amd64, arm64,
  # arm/v7) the mirror copies whole. Its tag is the source commit's committer
  # date with leading zeros dropped, a dash, and the short commit hash
  # (`<year>.<month>.<day>-<hash>`), the same index on Docker Hub and GHCR;
  # upstream builds more than once on many days, so the pin watch's
  # dated-commit shape proposes the newest date and breaks a same-date tie by
  # each candidate's image-configuration `created` time, refusing an unbroken
  # tie. A person completes the bump after the service has come up healthy on
  # the box and one search has run through it.
  searxng:
    source: docker.io/searxng/searxng:2026.9.7-3e454637f
    digest: sha256:1dab138ea70a8ceb4d1c182f5c8f256088406c1742b99e279976157dbe1e9759
  # The observability tier: seven mirrored
  # pins resolved on the box with `skopeo inspect --raw` on 2026-09-03. Docker
  # Hub wherever the upstream publishes there; the DCGM exporter is nvcr.io
