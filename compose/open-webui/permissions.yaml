# The complete v0.11.0 permissions tree. Each leaf records the source of its
# desired value so changes remain reviewable as an explicit product decision.
workspace:
  models: false # product value: model access is not granted by default
  # No matter knowledge bases in 0.x before Ingestion GA; the product value
  # (true) returns at Ingestion GA (v0.7.0). The permission binds every
  # user-role account; the frontend's admins bypass it by design.
  knowledge: false # false until Ingestion GA; product value: true
  prompts: true # product value
  tools: false # product value
  skills: false # product value
  models_import: false # upstream default
  models_export: false # upstream default
  prompts_import: false # upstream default
  prompts_export: false # upstream default
  tools_import: false # upstream default
  tools_export: false # upstream default
  skills_import: false # upstream default
  skills_export: false # upstream default

sharing:
  models: false # upstream default
  public_models: false # plan rule: public sharing off across the board
  knowledge: false # upstream default
  public_knowledge: false # plan rule: public sharing off across the board
  prompts: true # product value
  public_prompts: false # plan rule: public sharing off across the board
  tools: false # upstream default
  public_tools: false # plan rule: public sharing off across the board
  skills: false # upstream default
  public_skills: false # plan rule: public sharing off across the board
  notes: false # upstream default
  public_notes: false # plan rule: public sharing off across the board
  folders: false # upstream default
  public_chats: false # plan rule: public sharing off across the board
  public_calendars: false # plan rule: public sharing off across the board

access_grants:
  allow_users: true # upstream default
  allow_groups: true # upstream default

chat:
  controls: false # product value
  valves: false # plan rule: disabled with chat controls
  system_prompt: false # plan rule: disabled with chat controls
  params: false # plan rule: disabled with chat controls
  file_upload: true # product value
  # "Attach Webpage" fetches a user-typed URL off the box outside the warned
  # search egress and an upload by another door, and a failed YouTube fetch logs
  # the URL where no log may carry a user's text. The pinned
  # frontend gates the item and the chat page's ?load-url= and ?youtube=
  # parameters on this leaf alone; the route stays open below the UI to a
  # signed-in session's direct call, the accepted class of gate; the frontend's
  # admins bypass it by design. exempt: policy toggles.
  web_upload: false # product decision; upstream default: true
  delete: true # product value
  delete_message: true # upstream default
  continue_response: true # upstream default
  regenerate_response: true # upstream default
  rate_response: true # product decision; upstream default: true
  edit: true # upstream default
  share: false # plan rule: no chat share links
  export: true # product value
  import: true # upstream default
  stt: true # upstream default
  tts: true # upstream default
  call: true # upstream default
  multiple_models: false # product value
  temporary: true # upstream default
  temporary_enforced: false # upstream default

features:
  api_keys: false # product value
  notes: true # upstream default
  channels: true # upstream default
  folders: true # upstream default
  direct_tool_servers: false # product value
  web_search: true # product value
  image_generation: false # product value
  code_interpreter: false # product value
  memories: false # plan rule: Memory off
  calendar: true # upstream default
  automations: false # upstream default
  webhooks: false # upstream default

settings:
  interface: true # upstream default
