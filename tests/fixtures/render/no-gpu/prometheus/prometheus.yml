global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: grafana
    # Grafana serves from its sub-path; the bare /metrics redirects to the
    # public root URL, which is unreachable from the Compose network.
    metrics_path: /grafana/metrics
    static_configs:
      - targets: [grafana:3000]
  - job_name: caddy
    static_configs:
      - targets: [caddy:2020]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: search
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://searxng:8080/healthz]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: ingress
    metrics_path: /probe
    params:
      module: [http_2xx_ca]
    static_configs:
      - targets: [https://caddy/]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: frontend
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://open-webui:8080/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
