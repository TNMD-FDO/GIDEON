apiVersion: 1
contactPoints:
  - orgId: 1
    name: page
    receivers:
      - uid: page-email
        type: email
        settings:
          addresses: "ops@exd.example.org"
          singleEmail: true
          subject: "[GIDEON EXD-FDO] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}"
          message: |
            {{ range .Alerts }}{{ .Status | toUpper }}: {{ .Labels.alertname }}: {{ .Annotations.summary }}{{ with .Annotations.runbook }} (runbook: {{ . }}){{ end }}
            {{ end }}
            What to do: on the box, run gideon status; the full steps are in the runbook named above.
  - orgId: 1
    name: nudge
    receivers:
      - uid: nudge-email
        type: email
        disableResolveMessage: true
        settings:
          addresses: "ops@exd.example.org"
          singleEmail: true
          subject: "[GIDEON EXD-FDO] Proposals waiting"
          message: |
            Proposals waiting on this box: {{ (index .Alerts 0).Values.B }}
            Read them with gideon proposals.
