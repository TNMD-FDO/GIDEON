[[servers]]
host = "exd.example.internal"
port = 3269
use_ssl = true
start_tls = false
ssl_skip_verify = false
root_ca_cert = "/etc/gideon/ca.pem"
bind_dn = "svc-gideon-bind@exd.example.internal"
bind_password = '$__file{/run/secrets/ldap_bind_password}'
search_filter = "(sAMAccountName=%s)"
search_base_dns = ["DC=exd,DC=example,DC=internal"]

[servers.attributes]
username = "sAMAccountName"
email = "userPrincipalName"
member_of = "memberOf"

[[servers.group_mappings]]
group_dn = "CN=GIDEON-Admins,CN=Users,DC=exd,DC=example,DC=internal"
org_role = "Admin"
grafana_admin = true
