apiVersion: 1
contactPoints:
  - orgId: 1
    name: page
    receivers:
      - uid: page-email
        type: email
        settings:
          addresses: "csa1@example.org;csa2@example.org"
          singleEmail: true
          subject: "[GIDEON TNMD-FDO] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}"
          message: |
            {{ range .Alerts }}{{ .Status | toUpper }}: {{ .Labels.alertname }}: {{ .Annotations.summary }}{{ with .Annotations.runbook }} (runbook: https://github.com/TNMD-FDO/GIDEON/blob/vfixture/{{ . }}){{ end }}
            {{ end }}
            What to do: on the box, run gideon status; the full steps are in the runbook named above.
  - orgId: 1
    name: nudge
    receivers:
      - uid: nudge-email
        type: email
        disableResolveMessage: true
        settings:
          addresses: "csa1@example.org;csa2@example.org"
          singleEmail: true
          subject: "[GIDEON TNMD-FDO] Proposals waiting"
          message: |
            Proposals waiting on this box: {{ (index .Alerts 0).Values.B }}
            Read them with gideon proposals.
  - orgId: 1
    name: upstream
    receivers:
      - uid: upstream-email
        type: email
        disableResolveMessage: true
        settings:
          addresses: "csa1@example.org;csa2@example.org"
          singleEmail: true
          subject: "[GIDEON TNMD-FDO] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}"
          message: |
            {{ range .Alerts }}{{ .Status | toUpper }}: {{ .Labels.alertname }}: {{ .Annotations.summary }}{{ with .Annotations.runbook }} (runbook: https://github.com/TNMD-FDO/GIDEON/blob/vfixture/{{ . }}){{ end }}
            {{ end }}
            What to do: on the box, run gideon status; the full steps are in the runbook named above.
  - orgId: 1
    name: heartbeat
    receivers:
      - uid: heartbeat-email
        type: email
        disableResolveMessage: true
        settings:
          addresses: "csa1@example.org;csa2@example.org"
          singleEmail: true
          subject: "[GIDEON TNMD-FDO] Channel heartbeat"
          message: |
            The alert engine and the mail path are alive: this is the Saturday heartbeat from the GIDEON box at TNMD-FDO.
            Nothing is owed. A Saturday without this email is the alarm; the start-here card's weekly section says what to do then.
