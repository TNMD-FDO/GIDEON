# Substituted by tests/contract/search_sentinel.py; never started by hand.
name: gideon-ci-sentinel
services:
  postgres:
    image: "${POSTGRES_IMAGE}"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    secrets: [postgres_superuser_password]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
  open-webui:
    image: "${OPEN_WEBUI_IMAGE}"
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:${CONTRACT_PORT}:8080"]
    env_file:
      - path: ./open-webui.env
        format: raw
    environment:
      WEBUI_NAME: GIDEON
      WEBUI_URL: "http://127.0.0.1:${CONTRACT_PORT}"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "true"
      DEFAULT_USER_ROLE: user
      DEFAULT_MODELS: "${DEFAULT_MODELS}"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      WEBUI_ADMIN_EMAIL: gideon-admin@gideon.invalid
      WEBUI_ADMIN_NAME: gideon-admin
      WEBUI_SECRET_KEY_FILE: /run/secrets/webui_secret_key
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: "${ALLOWED_ENDPOINTS}"
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "${BYPASS_EMBEDDING_AND_RETRIEVAL}"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "http://stub:8000/v1"
      ENABLE_FORWARD_USER_INFO_HEADERS: "${ENABLE_FORWARD_USER_INFO_HEADERS}"
      ENABLE_LOCAL_WEB_FETCH: "true"
      GLOBAL_LOG_LEVEL: "${GLOBAL_LOG_LEVEL}"
      AUDIT_LOG_LEVEL: "${AUDIT_LOG_LEVEL}"
      AUDIT_LOGS_FILE_PATH: "${AUDIT_LOGS_FILE_PATH}"
      ENABLE_AUDIT_STDOUT: "${ENABLE_AUDIT_STDOUT}"
      AUDIT_EXCLUDED_PATHS: "${AUDIT_EXCLUDED_PATHS}"
      ENABLE_AUDIT_GET_REQUESTS: "${ENABLE_AUDIT_GET_REQUESTS}"
      AUDIT_UVICORN_LOGGER_NAMES: "${AUDIT_UVICORN_LOGGER_NAMES}"
      ENABLE_OTEL: "${ENABLE_OTEL}"
      ENABLE_OTEL_TRACES: "${ENABLE_OTEL_TRACES}"
      ENABLE_OTEL_METRICS: "${ENABLE_OTEL_METRICS}"
      ENABLE_OTEL_LOGS: "${ENABLE_OTEL_LOGS}"
      ENABLE_QUERIES_CACHE: "${ENABLE_QUERIES_CACHE}"
      LOGURU_DIAGNOSE: "${LOGURU_DIAGNOSE}"
      ENABLE_SEARCH_QUERY_GENERATION: "${ENABLE_SEARCH_QUERY_GENERATION}"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "${ENABLE_RETRIEVAL_QUERY_GENERATION}"
      ENABLE_WEB_SEARCH: "${ENABLE_WEB_SEARCH}"
      WEB_SEARCH_ENGINE: "${WEB_SEARCH_ENGINE}"
      SEARXNG_QUERY_URL: "${SEARXNG_QUERY_URL}"
      WEB_SEARCH_RESULT_COUNT: "${WEB_SEARCH_RESULT_COUNT}"
      WEB_LOADER_ENGINE: "${WEB_LOADER_ENGINE}"
      BYPASS_WEB_SEARCH_WEB_LOADER: "${BYPASS_WEB_SEARCH_WEB_LOADER}"
      WEB_SEARCH_TRUST_ENV: "${WEB_SEARCH_TRUST_ENV}"
      ENABLE_WEB_LOADER_SSL_VERIFICATION: "${ENABLE_WEB_LOADER_SSL_VERIFICATION}"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "${BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL}"
      WEB_SEARCH_DOMAIN_FILTER_LIST: "${WEB_SEARCH_DOMAIN_FILTER_LIST}"
      TASK_MODEL_EXTERNAL: "${TASK_MODEL_EXTERNAL}"
      CONTENT_SECURITY_POLICY: "${CONTENT_SECURITY_POLICY}"
    command: "${OPEN_WEBUI_COMMAND}"
    secrets: [webui_secret_key]
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health | jq -ne 'input.status == true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
  searxng:
    image: "${SEARXNG_IMAGE}"
    environment:
      GRANIAN_LOG_ACCESS_ENABLED: "false"
      GRANIAN_LOG_CONFIG: /etc/searxng/logging.json
    env_file:
      - path: ./searxng/env
        format: raw
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/logging.json:/etc/searxng/logging.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  stub:
    image: "${OPEN_WEBUI_IMAGE}"
    entrypoint: ["python3", "/stub/stub.py"]
    # The frontend's page loader validates a result URL with a library that
    # rejects a hostname without a dot before its own address guard runs, so
    # the pages the stub serves are linked under this dotted alias (a reserved
    # documentation name) while the engine and SearXNG reach it as "stub".
    networks:
      default:
        aliases:
          - stub.sentinel.test
    volumes:
      - ./stub.py:/stub/stub.py:ro
    environment:
      STUB_MODE: "${STUB_MODE}"
      STUB_SENTINEL: "${STUB_SENTINEL}"
      STUB_MODEL_ID: "${STUB_MODEL_ID}"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  webui_secret_key:
    file: ./secrets/webui_secret_key
